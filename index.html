<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.O.S - Visualizador Cyber OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b10;
      --panel-bg: rgba(13, 20, 33, 0.95);
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --green-glow: #00ff66;
      --yellow-glow: #eab308;
      --border-color: rgba(0, 240, 255, 0.3);
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 25px 25px, 25px 25px;
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container { width: 100%; max-width: 680px; margin: 0 auto; }

    header {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 800; color: #fff; }
    .brand-title span { color: var(--cyan-glow); }

    .lote-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 4px 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
    }

    .card-os {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      background: rgba(4, 8, 15, 0.7);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.15);
    }

    .info-item label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 2px; }
    .info-item span { font-size: 1.05rem; font-weight: 700; color: #fff; }

    .section-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--cyan-glow);
      margin: 20px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header::before { content: '//'; color: var(--magenta-glow); }

    table.cyber-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    table.cyber-table th {
      background: rgba(0, 240, 255, 0.08);
      color: var(--cyan-glow);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    table.cyber-table td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
    .val-total { font-weight: bold; color: var(--green-glow); text-align: right; }

    .total-box {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--cyan-glow);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
    }

    .total-box .price {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--green-glow);
      text-shadow: 0 0 10px var(--green-glow);
    }

    .loading { text-align: center; padding: 40px; font-family: 'Orbitron', sans-serif; color: var(--cyan-glow); letter-spacing: 2px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">S.O.S <span>SEMIJOIAS</span></div>
      <div class="lote-badge" id="lbl-lote">CARREGANDO...</div>
    </header>

    <div class="card-os" id="main-card">
      <div class="loading">MAPEANDO MATRIZ DE DADOS S.O.S...</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const planId = urlParams.get('id') || '';

    async function carregarDadosUltraInteligente() {
      if (!planId) {
        document.getElementById('main-card').innerHTML = '<div class="loading">NENHUMA PLANILHA SELECIONADA</div>';
        return;
      }

      try {
        // Busca os dados via API do Google em formato JSON
        const url = `https://docs.google.com/spreadsheets/d/${planId}/gviz/tq?tqx=out:json`;
        const res = await fetch(url);
        const text = await res.text();
        
        const jsonString = text.substring(47, text.length - 2);
        const json = JSON.parse(jsonString);
        const rows = json.table.rows;

        // Converte toda a planilha em uma lista plana para busca dinâmica de palavras
        let cells = [];
        for (let r = 0; r < rows.length; r++) {
          if (!rows[r] || !rows[r].c) continue;
          for (let c = 0; c < rows[r].c.length; c++) {
            let cell = rows[r].c[c];
            if (cell && cell.v !== null && cell.v !== "") {
              let valStr = String(cell.v).trim();
              let valFmt = cell.f ? cell.f : valStr;
              cells.push({ r: r, c: c, v: valStr, f: valFmt });
            }
          }
        }

        // Função para encontrar valor abaixo ou perto de um título
        function findValNear(keyword, direction = 'down') {
          let kwLower = keyword.toLowerCase();
          let target = cells.find(item => item.v.toLowerCase() === kwLower || item.v.toLowerCase().includes(kwLower));
          
          if (!target) return '---';

          if (direction === 'down') {
            // Procura a célula na mesma coluna (ou perto) nas linhas imediatamente abaixo
            let below = cells.filter(item => item.r > target.r && item.r <= target.r + 3 && Math.abs(item.c - target.c) <= 2);
            if (below.length > 0) {
              // Retorna a primeira célula válida encontrada abaixo
              return below[0].f;
            }
          } else if (direction === 'right') {
            // Procura a célula na mesma linha do lado direito
            let right = cells.filter(item => item.r === target.r && item.c > target.c);
            if (right.length > 0) {
              return right[0].f;
            }
          }
          return '---';
        }

        // Leitura cirúrgica da matriz real visualizada
        // 1. Títulos e Informações Principais
        const cliente = findValNear("Nome do Cliente", "down");
        const lote = findValNear("Lote", "down");
        const pesoUnit = findValNear("Peso Unit", "down") !== '---' ? findValNear("Peso Unit", "down") : findValNear("Peso Unt", "down");
        const pesoTotal = findValNear("Peso Total", "down");
        const fornecedor = findValNear("Fornecedor", "down");
        const modelo = findValNear("Modelo", "down");
        const codigoProd = findValNear("AX", "down") !== '---' ? findValNear("AX", "down") : findValNear("Codigo Produto", "down");
        
        const categoria = findValNear("Categoria", "down") !== '---' ? findValNear("Categoria", "down") : findValNear("Categoria", "right");
        const tamanho = findValNear("16cm", "right") !== '---' ? "16cm" : findValNear("Tamanho", "right");
        const temLado = findValNear("TEM LADO", "right") !== '---' ? "TEM LADO" : findValNear("Lado", "right");

        // Banhos
        const banhoOuroQtd = findValNear("OURO", "down");
        const banhoPrataQtd = findValNear("PRATA", "down");
        const banhoOutroQtd = findValNear("OUTRO", "down");

        // Serviços (Varredura dinâmica na tabela)
        const listaNomesServicos = ["Inspeção", "Fotografia", "Cadastro Externo", "Etiqueta", "Encarte", "Cravação Buril", "Colagem", "Montagem", "Reposição"];
        let servicosHTML = '';

        listaNomesServicos.forEach(nome => {
          let itemKw = cells.find(c => c.v.toLowerCase().includes(nome.toLowerCase()));
          let unt = 'R$ 0,00', qtd = '0', total = 'R$ 0,00';

          if (itemKw) {
            let rowItems = cells.filter(c => c.r === itemKw.r && c.c > itemKw.c);
            if (rowItems.length >= 1) unt = rowItems[0].f;
            if (rowItems.length >= 2) qtd = rowItems[1].f;
            if (rowItems.length >= 3) total = rowItems[2].f;
          }

          servicosHTML += `
            <tr>
              <td>${nome}</td>
              <td style="text-align: center; color: var(--text-dim);">${unt}</td>
              <td style="text-align: center;">${qtd}</td>
              <td class="val-total">${total}</td>
            </tr>
          `;
        });

        // Custos Adicionais
        const valorInicial = findValNear("Valor Inicial", "right");
        const banhoOuroVal = findValNear("Custo Banho Ouro", "right");
        const banhoOuroTipo = findValNear("OURO 3%", "right") !== '---' ? "OURO 3%" : "---";
        const banhoPrataVal = findValNear("Custo Banho Prata", "right");
        const banhoPrataTipo = findValNear("PRATA 70", "right") !== '---' ? "PRATA 70" : "---";
        const vernizVal = findValNear("Verniz", "right");
        const vernizTipo = findValNear("Cataforetico", "right") !== '---' ? "Cataforetico" : "---";
        const insumosVal = findValNear("Insumos", "right");
        const corrente = findValNear("Corrente", "right");
        const valorBruto = findValNear("Valor Bruto", "down") !== '---' ? findValNear("Valor Bruto", "down") : findValNear("R$", "down");

        document.getElementById('lbl-lote').innerText = 'LOTE ' + (lote !== '---' ? lote : '');

        let banhosHTML = `
          <div class="info-item"><label>BANHO OURO (QTD)</label><span style="color: var(--yellow-glow);">${banhoOuroQtd}</span></div>
          <div class="info-item"><label>BANHO PRATA (QTD)</label><span style="color: #cbd5e1;">${banhoPrataQtd}</span></div>
        `;

        if (banhoOutroQtd !== '---') {
          banhosHTML += `<div class="info-item"><label>OUTROS BANHOS</label><span style="color: var(--cyan-glow);">${banhoOutroQtd}</span></div>`;
        }

        const html = `
          <div class="section-header">INFORMAÇÕES DO MODELO</div>
          <div class="info-grid">
            <div class="info-item"><label>CLIENTE</label><span>${cliente}</span></div>
            <div class="info-item"><label>LOTE</label><span style="color: var(--cyan-glow);">${lote}</span></div>
            <div class="info-item"><label>FORNECEDOR</label><span>${fornecedor}</span></div>
            <div class="info-item"><label>CATEGORIA</label><span style="color: var(--cyan-glow); font-weight: bold;">${categoria}</span></div>
            <div class="info-item"><label>MODELO</label><span style="color: var(--cyan-glow); font-size: 1.2rem;">${modelo}</span></div>
            <div class="info-item"><label>CÓDIGO PRODUTO</label><span>${codigoProd}</span></div>
            <div class="info-item"><label>PESO UNITÁRIO</label><span>${pesoUnit} g</span></div>
            <div class="info-item"><label>PESO TOTAL</label><span>${pesoTotal}</span></div>
            <div class="info-item"><label>TAMANHO</label><span>${tamanho}</span></div>
            <div class="info-item"><label>TEM LADO?</label><span style="color: var(--magenta-glow);">${temLado}</span></div>
            ${banhosHTML}
            <div class="info-item"><label>ADICIONAL CORRENTE</label><span>${corrente}</span></div>
          </div>

          <div class="section-header">SERVIÇOS & COMPOSIÇÃO</div>
          <table class="cyber-table">
            <thead>
              <tr>
                <th>SERVIÇO</th>
                <th style="text-align: center;">VALOR UNT</th>
                <th style="text-align: center;">QTD</th>
                <th style="text-align: right;">VALOR TOTAL</th>
              </tr>
            </thead>
            <tbody>
              ${servicosHTML}
            </tbody>
          </table>

          <div class="section-header">CUSTOS ADICIONAIS DE PRODUÇÃO</div>
          <table class="cyber-table">
            <tbody>
              <tr><td>Valor Inicial</td><td colspan="2" class="val-total">${valorInicial}</td></tr>
              <tr><td>Custo Banho Ouro <small style="color:var(--yellow-glow);">(${banhoOuroTipo})</small></td><td colspan="2" class="val-total">${banhoOuroVal}</td></tr>
              <tr><td>Custo Banho Prata <small style="color:#cbd5e1;">(${banhoPrataTipo})</small></td><td colspan="2" class="val-total">${banhoPrataVal}</td></tr>
              <tr><td>Verniz Cataforético <small style="color:var(--cyan-glow);">(${vernizTipo})</small></td><td colspan="2" class="val-total">${vernizVal}</td></tr>
              <tr><td>Insumos</td><td colspan="2" class="val-total">${insumosVal}</td></tr>
            </tbody>
          </table>

          <div class="total-box">
            <div>
              <span style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase;">VALOR BRUTO ESTIMADO</span>
              <div style="font-size: 0.75rem; color: var(--cyan-glow);">ORÇAMENTO POR MODELO</div>
            </div>
            <div class="price">${valorBruto}</div>
          </div>
        `;

        document.getElementById('main-card').innerHTML = html;

      } catch (err) {
        document.getElementById('main-card').innerHTML = '<div class="loading" style="color:var(--magenta-glow);">ERRO DE CONEXÃO COM A PLANILHA.</div>';
      }
    }

    window.onload = carregarDadosUltraInteligente;
  </script>
</body>
</html>

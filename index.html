<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.O.S - Área do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05080e;
      --panel-bg: rgba(10, 16, 26, 0.98);
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --green-glow: #00ff66;
      --border-color: rgba(0, 240, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.2) 0%, transparent 70%),
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; letter-spacing: 1px; }
    .brand-title span { color: var(--cyan-glow); text-shadow: 0 0 10px var(--cyan-glow); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 4px 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-glow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* MOLDURA FUTURISTA */
    .cyber-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 2px solid var(--cyan-glow);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: #090e18;
      padding: 10px 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--cyan-glow);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      letter-spacing: 1px;
    }

    .iframe-wrapper {
      width: 100%;
      height: 680px;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      color: var(--cyan-glow);
      text-align: center;
      background: #05080e;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--cyan-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">S.O.S <span>SEMIJOIAS</span></div>
    <div class="status-badge">
      <div class="dot"></div> CLIENTE HUD
    </div>
  </header>

  <div class="cyber-card">
    <div class="card-header">
      <span>// RESUMO DO MODELO</span>
      <span style="color: var(--magenta-glow);">AO VIVO</span>
    </div>

    <div class="iframe-wrapper" id="display-area">
      <div class="loading">CARREGANDO DADOS...</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const planId = urlParams.get('id') || '';

    if (planId) {
      // Pega dinamicamente a aba chamada 'Cliente' para QUALQUER planilha que passar na URL (?id=...)
      const embedUrl = `https://docs.google.com/spreadsheets/d/${planId}/htmlembed?sheet=Cliente&widget=false&headers=false&chrome=false`;
      document.getElementById('display-area').innerHTML = `<iframe src="${embedUrl}"></iframe>`;
    } else {
      document.getElementById('display-area').innerHTML = `<div class="loading" style="color:var(--magenta-glow);">NENHUMA PLANILHA INFORMADA</div>`;
    }
  </script>
</body>
</html>

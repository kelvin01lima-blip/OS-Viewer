<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.O.S - Área do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b10;
      --panel-bg: rgba(13, 20, 33, 0.95);
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --border-color: rgba(0, 240, 255, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.15) 0%, transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    header {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; }
    .brand-title span { color: var(--cyan-glow); }

    .lote-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 4px 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
    }

    /* MOLDURA FUTURISTA */
    .cyber-frame-wrapper {
      flex: 1;
      min-height: 85vh;
      position: relative;
      background: #ffffff;
      border: 2px solid var(--cyan-glow);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
      display: flex;
      flex-direction: column;
    }

    .frame-header {
      background: #0d1421;
      padding: 8px 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--cyan-glow);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      letter-spacing: 1px;
    }

    .iframe-container {
      width: 100%;
      height: 100%;
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: auto;
      display: flex;
      justify-content: center; /* Centraliza a tabela na tela */
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 700px;
      border: none;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      color: var(--cyan-glow);
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">S.O.S <span>SEMIJOIAS</span></div>
    <div class="lote-badge">ÁREA DO CLIENTE</div>
  </header>

  <div class="cyber-frame-wrapper">
    <div class="frame-header">
      <span>// ORÇAMENTO DO MODELO</span>
      <span style="color: var(--magenta-glow);">● AO VIVO</span>
    </div>
    <div class="iframe-container" id="display-area">
      <div class="loading">CARREGANDO DADOS DO CLIENTE...</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const planId = urlParams.get('id') || '';

    if (planId) {
      // Puxa a aba 'Cliente' mantendo a formatação completa e original da planilha
      const embedUrl = `https://docs.google.com/spreadsheets/d/${planId}/pubhtml?gid=1682700545&single=true&widget=false&headers=false&chrome=false`;
      document.getElementById('display-area').innerHTML = `<iframe src="${embedUrl}"></iframe>`;
    } else {
      document.getElementById('display-area').innerHTML = `<div class="loading" style="color:var(--magenta-glow);">NENHUMA PLANILHA INFORMADA</div>`;
    }
  </script>
</body>
</html>

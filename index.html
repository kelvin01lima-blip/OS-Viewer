<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.O.S - Visualizador de Orçamento & OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b10;
      --panel-bg: rgba(13, 20, 33, 0.95);
      --cyan-glow: #00f0ff;
      --magenta-glow: #ff0055;
      --green-glow: #00ff66;
      --border-color: rgba(0, 240, 255, 0.3);
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 20px);
    }

    header {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: #fff; }
    .brand-title span { color: var(--cyan-glow); }

    .lote-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 4px 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
    }

    .frame-wrapper {
      flex: 1;
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--cyan-glow);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status-bar {
      margin-top: 8px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      color: var(--cyan-glow);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">S.O.S <span>SEMIJOIAS</span> // OS</div>
      <div class="lote-badge">SISTEMA ATIVO</div>
    </header>

    <div class="frame-wrapper">
      <iframe id="sheet-frame" src="about:blank"></iframe>
    </div>

    <div class="status-bar">// DADOS SINCRONIZADOS EM TEMPO REAL COM O GOOGLE DRIVE</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const planId = urlParams.get('id') || '';

    if (planId) {
      document.getElementById('sheet-frame').src = `https://docs.google.com/spreadsheets/d/${planId}/htmlview`;
    } else {
      document.getElementById('sheet-frame').srcdoc = `<h3 style="font-family:sans-serif; text-align:center; margin-top:50px; color:#333;">Cole o link de uma planilha no gerador de QR Code para visualizar os dados aqui.</h3>`;
    }
  </script>
</body>
</html>
